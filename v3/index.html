<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英打遊戲｜版本三 ASDF</title>
<style>
  :root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#243e38;background:#f5f3ec;line-height:1.7}
  *{box-sizing:border-box}
  body{margin:0}
  main{max-width:720px;margin:auto;padding:32px 20px;text-align:center}
  .eyebrow{font-size:13px;letter-spacing:.14em;color:#596f62;margin:0}
  h1{font-size:clamp(28px,6vw,44px);margin:8px 0 12px}
  .panel{background:#fff;border:1px solid #ccd7ce;border-radius:20px;padding:24px;margin:20px 0}
  .score{font-size:20px}
  .score b{font-size:36px}
  #target{font-size:120px;font-weight:800;line-height:1.1;margin:16px 0;min-height:132px}
  #message{min-height:2em;font-size:18px;margin:8px 0}
  .keys{display:flex;gap:10px;justify-content:center;margin-top:16px}
  .key{width:64px;height:60px;border-radius:10px;border:1px solid #98ad9e;border-bottom-width:5px;background:#f9faf4;color:#53645a;font-size:24px;font-weight:700;display:grid;place-items:center;user-select:none}
  .key.lit{background:#a1332e;color:#fff;border-color:#682a28}
  button.start{font:inherit;font-size:20px;padding:12px 32px;border:0;border-radius:12px;background:#426d5e;color:#fff;cursor:pointer}
  button:focus-visible{outline:3px solid #b16b35;outline-offset:4px}
  a{color:#205d50}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <p class="eyebrow">VERSION 03</p>
  <h1>ASDF 英打練習</h1>
  <p>畫面出現哪個字母，就按下<strong>鍵盤</strong>上對應的鍵（不是用滑鼠點）。</p>
  <section class="panel">
    <button class="start" id="start" type="button">開始</button>
    <div id="play" hidden>
      <p class="score">得分：<b id="score">0</b></p>
      <div id="target" aria-live="polite">-</div>
      <p id="message" role="status"></p>
      <div class="keys" id="keys"></div>
    </div>
  </section>
  <p><a href="../index.html">回開發歷程首頁</a></p>
</main>
<script>
const LETTERS = ['A','S','D','F'];
const $ = id => document.getElementById(id);
let score = 0, target = null, playing = false;
const held = new Set();

LETTERS.forEach(l => {
  const b = document.createElement('div');
  b.className = 'key'; b.textContent = l; b.dataset.k = l;
  b.setAttribute('aria-hidden', 'true');
  $('keys').appendChild(b);
});

function nextTarget() {
  const pool = LETTERS.filter(l => l !== target);
  target = pool[Math.floor(Math.random() * pool.length)];
  $('target').textContent = target;
  document.querySelectorAll('.key').forEach(k => k.classList.toggle('lit', k.dataset.k === target));
}

function press(letter) {
  if (!playing) return;
  if (letter === target) {
    score += 1;
    $('score').textContent = score;
    $('message').textContent = '答對了！+1';
    nextTarget();
  } else {
    $('message').textContent = '按錯了，再試一次：' + target;
  }
}

$('start').addEventListener('click', () => {
  playing = true; score = 0; target = null;
  $('score').textContent = 0;
  $('message').textContent = '';
  $('start').hidden = true;
  $('play').hidden = false;
  nextTarget();
});

document.addEventListener('keydown', e => {
  if (!playing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!/^[a-zA-Z]$/.test(e.key)) return;
  if (e.repeat) return;                 // 長按不連續計分
  const k = e.key.toUpperCase();
  if (held.has(k)) return;              // 沒放開前不重複處理
  held.add(k);
  press(k);
});
document.addEventListener('keyup', e => held.delete(e.key.toUpperCase()));
window.addEventListener('blur', () => held.clear());
</script>
</body>
</html>
